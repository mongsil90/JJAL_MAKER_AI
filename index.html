<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>무도 짤 메이커</title>
  <link rel="stylesheet" href="styles.css" />
  <script defer src="app.js"></script>
</head>
<body>
  <header class="toolbar" role="toolbar" aria-label="도구 막대">
    <label class="file-btn">
      배경 이미지 업로드
      <input id="bg-upload" type="file" accept="image/*" />
    </label>

    <div class="controls">
      <button id="zoom-out" class="btn" title="축소">−</button>
      <button id="zoom-in" class="btn" title="확대">+</button>
      <button id="rot-left" class="btn" title="반시계 회전">↺</button>
      <button id="rot-right" class="btn" title="시계 회전">↻</button>
    </div>

    <div class="save-controls">
      <button id="download-btn" class="btn primary">PNG로 저장</button>
      <button id="open-newtab-btn" class="btn">새 탭으로 열기</button>
    </div>

    <span class="hint" aria-hidden="true">
      데스크톱: 드래그 이동 · 휠 크기 · [ / ] 회전 · Delete 삭제<br/>
      모바일: 썸네일 탭 추가 · 한손가락 이동 · 두손가락 핀치/회전
    </span>
  </header>

  <main class="layout">
    <aside class="gallery">
      <h2>스티커 갤러리</h2>
      <div id="sticker-gallery" class="sticker-grid">
        <!-- JS가 stickers/manifest.json을 읽어 자동 생성 -->
      </div>
    </aside>

    <section class="stage">
      <!-- CSS 크기는 유지하고, 내부 비트맵은 DPR만큼 확대(레티나 대응) -->
      <canvas id="canvas" width="900" height="600" aria-label="스티커 편집 캔버스"></canvas>
    </section>
  </main>
</body>
</html>
